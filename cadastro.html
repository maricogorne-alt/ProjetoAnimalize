<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <main>
        <h1>Cadastro</h1>

         <form action="" method="post">
            <fieldset>
                <legend>Dados Pessoais</legend>

                    <label for="name">
                        <span>Nome Completo</span>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            required
                        >
                    </label>

                    <label for="birthdate">
                        <span>Data de Nascimento</span>
                        <input 
                            type="date" 
                            id="birthdate" 
                            name="birthdate" 
                            min="1900-01-01" 
                            max="2008-12-31"
                            required>
                    </label>

                    <label for="cpf">
                        <span>CPF</span>
                        <input 
                            type="text" 
                            id="cpf" 
                            name="cpf"
                            inputmode="numeric"
                            maxlength="14" 
                            pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                            placeholder="000.000.000-00"
                            required
                        >
                    </label>
            </fieldset>
            
            <fieldset>
                <legend>Informações de Contato</legend>

                    <label for="phone">
                        <span>Telefone</span>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            placeholder="(11) 99999-9999"
                            maxlength="15" 
                            pattern="(?:\(?\d{2}\)?\s?)?\d{4,5}-?\d{4}"
                            required
                        >
                    </label>

                    <label for="email">
                        <span>E-mail</span>
                        <input 
                            type="email" 
                            id="email"
                            name="email"
                            placeholder="exemplo@gmail.com" 
                            required
                        >
                    </label>
            </fieldset>

            <fieldset>
                <legend>Crie uma senha</legend>

                    <label for="password">
                        <span>Senha</span>
                        <input 
                            type="password"
                            id="password" 
                            name="password"
                            placeholder="Insira ao menos 6 caracteres."
                            minlength="6"
                            required
                        >
                    </label>

                    <label for="confirm_password">
                        <span>Confirme a Senha</span>
                        <input 
                            type="password" 
                            id="confirm_password" 
                            name="confirm_password"
                            minlength="6" 
                            required
                            >
                    </label>
            </fieldset>

            <button type="submit">Cadastrar</button>
         </form>
    </main>
    
</body>
</html>
